<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>四城落位预览 · v1</title>
<style>
  :root {
    --gold: #d4a843;
    --gold-light: #f0c060;
    --text-main: #f0e6d3;
    --text-sub: #c8b89a;
    --text-dim: #7a6a5a;
    --font-sans: system-ui, -apple-system, sans-serif;
    --font-serif: 'Noto Serif SC', serif;
  }
  body {
    margin: 0; padding: 0;
    background-color: #0a0508;
    color: var(--text-main);
    font-family: var(--font-sans);
  }
  .toolbar {
    position: fixed; top: 0; left: 0; right: 0;
    background: rgba(60,0,0,0.95);
    border-bottom: 2px solid var(--gold);
    height: 50px;
    display: flex; align-items: center; justify-content: space-between;
    padding: 0 20px;
    z-index: 10000;
  }
  .toolbar-title {
    font-size: 1.2rem; font-weight: bold; color: var(--gold-light);
  }
  .toolbar-controls button {
    background: transparent; border: 1px solid var(--gold);
    color: var(--gold); padding: 4px 10px; margin-left: 10px;
    cursor: pointer; font-size: 0.9rem; border-radius: 4px;
  }
  .toolbar-controls button.active {
    background: var(--gold); color: #000;
  }
  .map-wrapper {
    margin-top: 50px;
    width: 100%;
    display: flex; justify-content: center;
    overflow-x: auto;
  }
  .map-container {
    width: 100%;
    max-width: 1200px;
    transition: max-width 0.3s ease;
  }
  .map-container.mobile-view {
    max-width: 380px;
  }
  svg { width: 100%; height: auto; display: block; }

  @keyframes pulseGold {
    0% { opacity: 0.4; stroke-width: 2.5; }
    50% { opacity: 1; stroke-width: 3.5; }
    100% { opacity: 0.4; stroke-width: 2.5; }
  }
  .new-city-ring {
    stroke: rgba(255,210,120,0.95);
    fill: none;
    animation: pulseGold 1.5s ease-in-out infinite;
  }


/* ════ 城池悬浮卡 v15 ════ */
.sgmap-tooltip {
  position:fixed; z-index:9999; pointer-events:none;
  opacity:0; transition:opacity .12s;
  background: rgba(7,6,13,.96);
  border: 1px solid rgba(200,160,70,.28);
  border-radius: 10px; padding: 12px 16px 14px;
  font-size: .8rem; width: 310px;
  box-shadow: 0 16px 48px rgba(0,0,0,.92), inset 0 1px 0 rgba(255,255,255,.05);
  color:#c8b89a;
}
.sgmap-tooltip.visible { opacity:1; }
.sgmap-tooltip .sgt-header {
  display: flex; align-items: center; gap: 8px;
  margin-bottom: 7px; padding-bottom: 7px;
  border-bottom: 1px solid rgba(180,148,68,.22);
  flex-wrap: wrap;
}
.sgmap-tooltip .sgt-name { font-family:'Noto Serif SC',serif; font-size:1.02rem; font-weight:900; letter-spacing:.06em; color:#f0e6d3; }
.sgmap-tooltip .sgt-faction-chip {
  display:inline-block;
  font-size:.62rem;
  padding:2px 9px;
  border-radius:10px;
  font-weight:600;
  letter-spacing:.04em;
  line-height:1.4;
  white-space:nowrap;
}
.sgmap-tooltip .sgt-badges { display:flex; gap:4px; margin-left:auto; flex-shrink:0; flex-wrap:wrap; justify-content:flex-end; }
.sgmap-tooltip .sgt-badge {
  font-size:.58rem; border:1px solid rgba(212,168,67,.30); border-radius:9px; padding:1px 7px;
  color:#a07830; font-weight:600; background:rgba(212,168,67,.08);
}
.sgmap-tooltip .sgt-badge.tier-4 { border-color:rgba(220,90,70,.5); color:#f0a878; background:rgba(220,80,60,.14); }
.sgmap-tooltip .sgt-badge.tier-3 { border-color:rgba(212,168,67,.55); color:#f0c060; background:rgba(212,168,67,.16); }
.sgmap-tooltip .sgt-desc {
  font-size:.71rem; color:#7a6a5a; line-height:1.65; margin-bottom:7px; font-family:'Noto Serif SC',serif;
}
.sgmap-tooltip .sgt-info-block {
  display:flex; flex-direction:column; gap:5px;
  padding:7px 9px; background:rgba(255,255,255,.03);
  border-radius:5px; border:1px solid rgba(180,148,68,.10);
}
.sgmap-tooltip .sgt-row { display:flex; align-items:center; gap:8px; font-family:'Noto Serif SC',serif; }
.sgmap-tooltip .sgt-lbl { font-size:.60rem; color:#7a6a5a; white-space:nowrap; flex-shrink:0; letter-spacing:.04em; }
.sgmap-tooltip .sgt-holder b { font-weight:700; font-size:.82rem; font-family:'Noto Sans SC',sans-serif; color:#f0e6d3; letter-spacing:.04em; }
.sgmap-tooltip .sgt-troops { flex-wrap:wrap; }
.sgmap-tooltip .sgt-troop-list { display:flex; flex-wrap:wrap; gap:2px 10px; }
.sgmap-tooltip .sgt-troop-chip { display:inline-flex; align-items:baseline; gap:3px; }

.sgmap-tooltip .sgt-troop-chip span { font-size:.82rem; font-weight:700; color:#c8b89a; }
.sgmap-tooltip .sgt-dim { font-size:.7rem; color:#5a4d3a; }
.sgmap-tooltip .sgt-prod-block {

.sgmap-tooltip .sgt-prod-block-title::before { content:''; width:2px; height:9px; background:rgba(212,168,67,.5); }

.sgmap-tooltip .sgt-prod-approx { font-size:.58rem; color:#7a6a5a; letter-spacing:.05em; }
.sgmap-tooltip .sgt-prod-num { font-size:1.05rem; font-weight:700; color:#f0c060; letter-spacing:.02em; }
.sgmap-tooltip .sgt-prod-unit { font-size:.62rem; color:#c8b89a; letter-spacing:.04em; }

.sgmap-tooltip .sgt-prod-mini-badge { font-size:.56rem; letter-spacing:.06em; padding:1px 6px; border-radius:8px; font-weight:600; }
.sgmap-tooltip .sgt-prod-mini-badge.policy { background:rgba(80,140,80,.16); border:1px solid rgba(100,170,100,.28); color:#98d09a; }

.sgt-adept-row {
  width: 100%;
  background: linear-gradient(90deg, rgba(212,168,67,.10), rgba(212,168,67,.02));
  border-left: 3px solid #d4a843;
  border-radius: 0 var(--r) var(--r) 0;
  padding: 4px 8px;
  margin-top: 4px;
  font-size: .72rem;
  line-height: 1.4;
  font-family: inherit;
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  gap: 4px 6px;

.sgt-adept-row .adept-item {
  display: inline-flex;
  align-items: center;
  gap: 3px;
  white-space: nowrap;

.sgt-adept-row .adept-sep {

.sgt-adept-row .adept-desc { color: #c8b89a; }
.sgt-adept-row .adept-val { color: #d4a843; font-weight: 700; }


/* ── 武将胶囊:字号下调一档 + padding 收紧 + 透明底 + 发丝灰边 ── */
.sgmap-tooltip .sgt-gen-pill-row {

.sgmap-tooltip .sgt-gen-pill {

  border-radius: 3px;
  color: #f0e6d3;
  letter-spacing: .025em;
  line-height: 1.5;
}

const HEX_R = 25, HEX_H = HEX_R * Math.sqrt(3);
const COL_STEP = HEX_R * 1.5;
const ROW_STEP = HEX_H / 2;

function _esc(s) {
  if (!s) return '';
  return String(s).replace(/&/g, '&amp;')
                  .replace(/</g, '&lt;')
                  .replace(/>/g, '&gt;')
                  .replace(/"/g, '&quot;')
                  .replace(/'/g, '&#39;');
}

function hexToXY(col, row) {
    const c = col - GRID_COL_START;
    const r = row - GRID_ROW_START;
    const x = HEX_R + 2 + c * COL_STEP;
    const y = HEX_H / 2 + 2 + r * ROW_STEP + (col % 2 === 1 ? HEX_H / 2 : 0);
    return { x, y };
  }
function hexPoints(cx, cy, r) {
    const pts = [];
    for (let i = 0; i < 6; i++) {
      const a = (Math.PI / 3) * i;
      pts.push(`${(cx + r * Math.cos(a)).toFixed(2)},${(cy + r * Math.sin(a)).toFixed(2)}`);
    }
    return pts.join(' ');
  }
function _emptyTerrain(col, row) {
    // 极西苦寒（西域方向）
    if (col <= 2 && row <= 8) return '苦寒';
    if (col <= 1) return '苦寒';
    // 西平/永昌方向苦寒
    if (col <= 4 && row >= 12) return '苦寒';
    // 东北沿海（幽州/青州海域）
    if (col >= 18 && row >= 2) return '水域';
    if (col >= 19) return '水域';
    // 东南扬州水域
    if (col >= 16 && row >= 9) return '水域';
    if (col >= 17 && row >= 6) return '水域';
    // 北方苦寒（幽州北部）
    if (row <= 0 && col >= 12) return '苦寒';
    if (row <= 1 && col >= 15) return '苦寒';
    // 并州/雍凉山地
    if (col >= 9 && col <= 14 && row <= 3) return '山地';
    if (col >= 5 && col <= 9 && row <= 5) return '山地';
    // 益州山地（蜀道群山）
    if (col >= 4 && col <= 9 && row >= 7 && row <= 12) return '山地';
    // 南中瘴林
    if (col >= 4 && col <= 10 && row >= 12) return '瘴林';
    if (col <= 6 && row >= 10) return '瘴林';
    // 荆南森林
    if (col >= 10 && col <= 14 && row >= 11) return '森林';
    // 中原/平原（默认）
    return '平原';
  }
function _calcViewBox() {
    let minX = Infinity, minY = Infinity, maxX = -Infinity, maxY = -Infinity;
    for (let col = GRID_COL_START; col <= GRID_COL_END; col++) {
      for (let row = GRID_ROW_START; row <= GRID_ROW_END; row++) {
        const { x, y } = hexToXY(col, row);
        minX = Math.min(minX, x - HEX_R);
        minY = Math.min(minY, y - HEX_H / 2);
        maxX = Math.max(maxX, x + HEX_R);
        maxY = Math.max(maxY, y + HEX_H / 2);
      }
    }
    const pad = 8;
    return {
      x: minX - pad,
      y: minY - pad,
      w: maxX - minX + pad * 2,
      h: maxY - minY + pad * 2,

    <filter id="fshadow" x="-50%" y="-50%" width="200%" height="200%">
      <feDropShadow dx="0" dy="2" stdDeviation="3.5" flood-color="#000" flood-opacity="0.75"/>
    </filter>`;
    const hlWhite = `
    <linearGradient id="hexHL" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#fff" stop-opacity="0.20"/>
      <stop offset="50%"  stop-color="#fff" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#fff" stop-opacity="0"/>
    </linearGradient>`;
    const hlGold = `
    <linearGradient id="hexHLGold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#ffe8a0" stop-opacity="0.22"/>
      <stop offset="50%"  stop-color="#ffe8a0" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#ffe8a0" stop-opacity="0"/>
    </linearGradient>`;
    return `<defs>${shadow}${hlWhite}${hlGold}</defs>`;
  }

  function _roadLines() {
    const drawn = new Set();
    return ROADS.map(([aid, bid]) => {
      const key = [aid, bid].sort().join('-');
      if (drawn.has(key)) return '';
      drawn.add(key);
      const ca = CITIES.find(c => c.id === aid);
      const cb = CITIES.find(c => c.id === bid);
      if (!ca || !cb) return '';
      const pa = hexToXY(ca.hx, ca.hy);
      const pb = hexToXY(cb.hx, cb.hy);
      const owA = cityOwnership[ca.name];
      const owB = cityOwnership[cb.name];
      const same = owA && owB
        && owA.owner !== '' && owA.owner !== 'npc'
        && owA.owner === owB.owner;
      if (same) {
        const pc = P_COLOR[owA.playerIdx] || NPC_C;
        return `<line x1="${pa.x.toFixed(1)}" y1="${pa.y.toFixed(1)}"
          x2="${pb.x.toFixed(1)}" y2="${pb.y.toFixed(1)}"
          stroke="${pc.glow}" stroke-width="1.5" stroke-opacity="0.4"
          stroke-dasharray="3.5,3" stroke-linecap="round"/>`;
      }
      return `<line x1="${pa.x.toFixed(1)}" y1="${pa.y.toFixed(1)}"
        x2="${pb.x.toFixed(1)}" y2="${pb.y.toFixed(1)}"
        stroke="rgba(255,255,255,0.04)" stroke-width="0.7"
        stroke-dasharray="2,5" stroke-linecap="round"/>`;
    }).join('');
  }
function _allHexes() {
    // 重建城池查找表
    _cityMap = {};
    CITIES.forEach(c => { _cityMap[`${c.hx},${c.hy}`] = c; });

    return (
      _terrainLayer()    + '\n' +   // L1: 水墨地形底色
      _neutralGridLayer()+ '\n' +   // L2: 中立蜂巢网格（灰色半透明）
      _cityLayer()                   // L4: 城池主体（含势力薄膜 + 高光 + 城名）
    );
  }
function _svg() {
    const b = _calcViewBox();
    return `<svg xmlns="http://www.w3.org/2000/svg"
      id="sgmap-svg"
      viewBox="${b.x.toFixed(1)} ${b.y.toFixed(1)} ${b.w.toFixed(1)} ${b.h.toFixed(1)}"
      preserveAspectRatio="xMidYMid meet"
      style="display:block;width:100%;height:auto;">
      ${_defs()}

      <!-- ── 最底层：水墨战略底图 ── -->


      <!-- ── 暗化蒙版：压深底图，突出城池与网格 ── -->
      <rect x="${b.x}" y="${b.y}" width="${b.w}" height="${b.h}"
        fill="rgba(5,4,10,0.62)" style="pointer-events:none"/>

      ${_allHexes()}
      <g id="road-layer">${_roadLines()}</g>
    </svg>`;
  }

function _calcProd(city, ow) {
    const tier = CITY_TIER_MAP[city.name] || '郡城';
    const base = CITY_TIER_BASE[tier];
    let gold = base.gold, food = base.food;
    const mults = [];
    (city.bonusKeys || [city.bonusKey] || []).forEach(k => {
      const m = BONUS_MULT[k]; if (!m) return;
      if (m.gold) { gold *= m.gold; mults.push({k, type:'gold', v:m.gold}); }
      if (m.food) { food *= m.food; mults.push({k, type:'food', v:m.food}); }
    });
    const isPlayer = ow && ow.owner && ow.owner !== 'npc' && ow.owner !== '';
    const chain = { base, tier, mults };
    return { gold: Math.round(gold), food: Math.round(food), chain, isPlayer };
  }




// Event binding mock because map.js bindEvents depends on dom
let _tooltip = null;
function init() {
  _tooltip = document.getElementById('sgmap-tooltip');

  // Set empty ownership for all cities
  CITIES.forEach(c => {
    cityOwnership[c.name] = {
      owner: 'npc', playerIdx: -1, playerName: '',
      holder: c.npcGuard || '', troops: {}, isMulti: false,
    };
  });

  const mapContainer = document.getElementById('map-container');
  mapContainer.innerHTML = _svg();

  // Bind hover
  const svg = document.getElementById('sgmap-svg');
  if(svg) {
      const gHover = svg.querySelector('g') || svg; // any element
      svg.addEventListener('mousemove', e => {
        const t = e.target.closest('.sgmap-city');
        if (!t) { _hideTip(); return; }
        const cname = t.getAttribute('data-name');
        const city = CITIES.find(x => x.name === cname);
        if (city) {
            // fake e, _moveTip needs clientX
            _showTip(e, city);
        }
      });
      svg.addEventListener('mouseleave', () => _hideTip());
  }
}

window.onload = function() {
  init();

  const btnDesktop = document.getElementById('btn-view-desktop');
  const btnMobile = document.getElementById('btn-view-mobile');
  const btnToggleNew = document.getElementById('btn-toggle-new');
  const mapContainer = document.getElementById('map-container');

  btnDesktop.addEventListener('click', () => {
    btnDesktop.classList.add('active');
    btnMobile.classList.remove('active');
    mapContainer.classList.remove('mobile-view');
  });

  btnMobile.addEventListener('click', () => {
    btnMobile.classList.add('active');
    btnDesktop.classList.remove('active');
    mapContainer.classList.add('mobile-view');
  });

  let showNew = true;
  btnToggleNew.addEventListener('click', () => {
    showNew = !showNew;
    if (showNew) {
      btnToggleNew.textContent = '隐藏新城';
      btnToggleNew.classList.remove('hidden-new');
      btnToggleNew.classList.add('active');

      const newRings = document.querySelectorAll('.new-city-ring');
      const newMarkers = document.querySelectorAll('.new-city-marker');
      const newRoads = document.querySelectorAll('.new-city-road');

      newRings.forEach(el => el.style.display = '');
      newMarkers.forEach(el => el.style.display = '');
      newRoads.forEach(el => el.style.display = '');

    } else {
      btnToggleNew.textContent = '显示新城';
      btnToggleNew.classList.add('hidden-new');
      btnToggleNew.classList.remove('active');

      const newRings = document.querySelectorAll('.new-city-ring');
      const newMarkers = document.querySelectorAll('.new-city-marker');
      const newRoads = document.querySelectorAll('.new-city-road');

      newRings.forEach(el => el.style.display = 'none');
      newMarkers.forEach(el => el.style.display = 'none');
      newRoads.forEach(el => el.style.display = 'none');
    }
  });
};
